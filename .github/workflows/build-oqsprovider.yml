name: Build oqs-provider (PQC OpenSSL provider)

# One-off/occasional build: compiles liboqs + oqs-provider on an
# ubuntu-24.04 runner — the same OS/glibc as infra/compute.tf's
# app-vm image — and uploads the resulting oqsprovider.so (plus the
# liboqs shared libs it links against) as a workflow run artifact.
#
# Deliberately NOT published as a GitHub Release: app-vm doesn't fetch
# from here directly (see infra/scripts/startup.sh.tpl's Stage 8b) — the
# operator downloads this run's artifact once (`gh run download`) and
# uploads it to the private GCS bucket in infra/artifacts.tf
# (google_storage_bucket.vm_assets), which is what the VM actually reads
# from at boot. That keeps the VM's runtime path independent of GitHub
# Actions/Releases and needs no GCP credential in this workflow at all.
#
# liboqs is ~2700 translation units, which does not finish in any
# reasonable time on app-vm's e2-micro shared vCPU (observed: still <2%
# done after several minutes). Building once here, on a matching-glibc
# runner with real CPU, and shipping the binary is the only practical
# way to get PQC support onto that instance.
#
# Manually triggered (workflow_dispatch) rather than on every push: the
# upstream pins (liboqs/oqs-provider tags) rarely change, so there is no
# need to rebuild on unrelated commits.
on:
  workflow_dispatch:
    inputs:
      liboqs_ref:
        # oqs-provider's RELEASE.md states each release's exact compatible
        # liboqs tag — they are NOT interchangeable across minor versions
        # (mismatched pairs fail to compile: oqs-provider references
        # liboqs symbols, e.g. OQS_SIG_alg_sphincs_*, that get renamed or
        # dropped between liboqs releases). 0.11.0 is pinned to 0.15.0.
        description: "liboqs git tag/ref to build (must match oqs_provider_ref's documented compatible liboqs version in its RELEASE.md)"
        required: true
        default: "0.15.0"
      oqs_provider_ref:
        description: "oqs-provider git tag/ref to build"
        required: true
        default: "0.11.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev pkg-config git

      - name: Build liboqs
        run: |
          git clone --depth 1 --branch "${{ inputs.liboqs_ref }}" https://github.com/open-quantum-safe/liboqs.git
          cmake -S liboqs -B liboqs/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build liboqs/build
          sudo cmake --install liboqs/build
          sudo ldconfig

      - name: Build oqs-provider
        run: |
          git clone --depth 1 --branch "${{ inputs.oqs_provider_ref }}" https://github.com/open-quantum-safe/oqs-provider.git
          cmake -S oqs-provider -B oqs-provider/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOQS_PROVIDER_BUILD_STATIC=OFF \
            -Dliboqs_DIR=/usr/local/lib/cmake/liboqs
          cmake --build oqs-provider/build

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp oqs-provider/build/lib/oqsprovider.so dist/
          # oqsprovider.so dynamically links against liboqs's shared lib;
          # ship the exact .so (with its SONAME symlink target) it was
          # built against so the VM doesn't need to build liboqs either.
          cp -P /usr/local/lib/liboqs.so* dist/
          tar -C dist -czf oqsprovider-ubuntu24.04-amd64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oqsprovider-ubuntu24.04-amd64
          path: oqsprovider-ubuntu24.04-amd64.tar.gz
          retention-days: 14
