name: Release

# Semver tags + GitHub Releases, driven by Conventional Commits (the same
# feat/fix/... convention the repo already enforces on commit messages).
#
# release-please maintains one open "release PR" that bumps web/package.json
# and web/CHANGELOG.md from the commits landed on main since the last release.
# Merging that PR is what creates the tag (vX.Y.Z) and the GitHub Release:
#   feat: ...            -> minor bump
#   fix: ...             -> patch bump
#   feat!: / BREAKING CHANGE: footer -> major bump
#
# A deploy to the VM happens ONLY when that PR merge produces a release —
# the deploy job below calls .github/workflows/deploy.yml, gated on
# release_created. Plain pushes to main do not deploy.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: deploy released version to the VM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
