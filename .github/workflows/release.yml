name: Release

# Semver tags + GitHub Releases, driven by Conventional Commits (the same
# feat/fix/... convention the repo already enforces on commit messages).
#
# release-please maintains one open "release PR" that bumps web/package.json
# and web/CHANGELOG.md from the commits landed on main since the last release.
# Merging that PR is what creates the tag (vX.Y.Z) and the GitHub Release:
#   feat: ...            -> minor bump
#   fix: ...             -> patch bump
#   feat!: / BREAKING CHANGE: footer -> major bump
#
# A deploy to the VM happens ONLY when that PR merge produces a release —
# the deploy job below calls .github/workflows/deploy.yml, gated on
# releases_created. Plain pushes to main do not deploy.
#
# The release PR is opened with a GitHub App installation token, not the
# default GITHUB_TOKEN: events created with GITHUB_TOKEN do not start other
# workflows, so a release PR authored by github-actions[bot] got CI runs that
# failed at startup with zero jobs. The App (Contents, Pull requests and
# Issues: read & write, installed on this repository only) is configured via
# the RELEASE_APP_ID repository variable and the RELEASE_APP_PRIVATE_KEY
# secret; the token it mints expires after one hour.
#
# NOTE: this action runs in manifest mode (config-file + manifest-file), so it
# emits `releases_created` / `paths_released` and per-path `web--tag_name` —
# NOT the bare `release_created` / `tag_name` of simple mode.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR / tag
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs['web--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: deploy released version to the VM
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
