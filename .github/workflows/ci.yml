name: CI

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  iac-guardrails:
    name: infra IAM & firewall guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Credential-free static checks. These protect the Amendment 2 hardening
      # (R2 instance-scoped IAM, R3 opt-in public :22) from silently regressing —
      # terraform fmt/validate cannot see IAM scope or firewall breadth.
      - name: Deploy SA holds no predefined project role
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bad=$(git grep -nE 'google_project_iam_(member|binding|policy)' -- infra/ \
                | grep -v 'resource "google_project_iam_member" "deploy_vm_operator"' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected project-level IAM binding in infra/ (only the deployVmOperator custom-role google_project_iam_member is allowed):"
            echo "$bad"
            exit 1
          fi
          # The one allowed binding must reference the custom role by resource
          # id, never a predefined "roles/..." literal (name-based allowlisting
          # alone would let roles/editor through under the same resource name).
          if grep -A4 'resource "google_project_iam_member" "deploy_vm_operator"' infra/wif.tf \
               | grep -qE 'role\s*=\s*"roles/'; then
            echo "::error::deploy_vm_operator binding must use google_project_iam_custom_role.deploy_vm_operator.id, not a predefined roles/ literal."
            exit 1
          fi

      - name: Custom project role stays read-only
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Extract the permissions = [ ... ] list of the custom role and allow
          # ONLY read verbs (.get / .list) on any service — an allowlist, so a
          # new mutating verb we didn't think to denylist still fails.
          perms=$(awk '/resource "google_project_iam_custom_role" "deploy_vm_operator"/,/^}/' infra/wif.tf \
                  | grep -oE '"[a-z]+\.[a-zA-Z.]+"' | tr -d '"')
          if [ -z "$perms" ]; then
            echo "::error::could not parse deployVmOperator permissions"; exit 1
          fi
          bad=$(echo "$perms" | grep -vE '\.(get|list)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::deployVmOperator custom role must hold only .get/.list permissions; found:"
            echo "$bad"
            exit 1
          fi

      - name: No firewall rule opens tcp:22 to 0.0.0.0/0
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          offenders=$(awk '
            /resource "google_compute_firewall"/ { blk=$0; has22=0; hasany=0; next }
            blk != "" {
              if ($0 ~ /"22"/)        has22=1
              if ($0 ~ /0\.0\.0\.0\/0/) hasany=1
              if ($0 ~ /^}/) {
                if (has22 && hasany) print blk
                blk=""
              }
            }
          ' infra/*.tf)
          if [ -n "$offenders" ]; then
            echo "::error::A google_compute_firewall rule allows tcp:22 from 0.0.0.0/0:"
            echo "$offenders"
            exit 1
          fi
          # The opt-in var must not default to (or be committed as) the whole internet.
          if grep -A6 'variable "operator_ssh_cidrs"' infra/variables.tf | grep -qE '0\.0\.0\.0/0'; then
            echo "::error::operator_ssh_cidrs default must not contain 0.0.0.0/0."
            exit 1
          fi
          if grep -qE '^\s*operator_ssh_cidrs\s*=.*0\.0\.0\.0/0' terraform.tfvars.example; then
            echo "::error::terraform.tfvars.example sets operator_ssh_cidrs to 0.0.0.0/0."
            exit 1
          fi

      - name: Keyless deploy keeps ssh key off project metadata
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # G6: without this, gcloud compute ssh writes its ephemeral key to
          # project-wide metadata, needing a project-level write the deploy SA
          # deliberately does not hold.
          if ! grep -qE 'block-project-ssh-keys\s*=\s*"TRUE"' infra/compute.tf; then
            echo "::error::infra/compute.tf must set metadata block-project-ssh-keys = \"TRUE\" so the keyless deploy stays instance-scoped."
            exit 1
          fi

      - name: allow_ssh firewall rule stays count-gated
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! grep -A4 'resource "google_compute_firewall" "allow_ssh"' infra/firewall.tf | grep -qE '^\s*count\s*='; then
            echo "::error::infra/firewall.tf allow_ssh must keep its 'count =' guard so public :22 stays opt-in."
            exit 1
          fi
